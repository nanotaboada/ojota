# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      numpy:
        patterns:
          - "numpy*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
